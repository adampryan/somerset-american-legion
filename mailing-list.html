<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mailing List - Somerset American Legion Post 228</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div data-component="top-bar"></div>
    </div>

    <div data-component="header"></div>

    <div data-component="nav"></div>

    <section class="page-header">
        <div class="container">
            <h1>Mailing List</h1>
            <p class="breadcrumb"><a href="index.html">Home</a> / Mailing List</p>
        </div>
    </section>

    <main class="page-content">
        <div class="container">
            <article class="primary-content" style="max-width: 800px;">
            <h2>Join Our Mailing List</h2>
            <p>Stay informed about Post 228 events, news, and activities.</p>
            
            <form id="mailing-list-form" class="contact-form">
                <div class="form-group">
                    <label for="name">Your Name *</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="interests">I'm interested in: (optional)</label>
                    <select id="interests" name="interests">
                        <option value="">Select...</option>
                        <option value="events">Events & Activities</option>
                        <option value="membership">Membership Information</option>
                        <option value="hall-rental">Hall Rental Updates</option>
                        <option value="all">All News</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" id="subscribe-btn">Subscribe</button>
                <div id="form-message" style="margin-top: 1rem; display: none;"></div>
            </form>

            <p style="margin-top: 2rem; font-size: 0.9rem; color: #6c757d;">We respect your privacy and will never share your information with third parties.</p>
        </article>
        </div>
    </main>

    <div data-component="footer"></div>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    <script>
    (function() {
        const API_URL = 'https://api.somersetamericanlegion.org';
        const form = document.getElementById('mailing-list-form');
        const btn = document.getElementById('subscribe-btn');
        const msgDiv = document.getElementById('form-message');

        function showMessage(text, isError = false) {
            msgDiv.style.display = 'block';
            msgDiv.style.padding = '1rem';
            msgDiv.style.borderRadius = '4px';
            msgDiv.style.background = isError ? '#f8d7da' : '#d4edda';
            msgDiv.style.color = isError ? '#721c24' : '#155724';
            msgDiv.textContent = text;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const interests = document.getElementById('interests').value;

            if (!name || !email) {
                showMessage('Please fill in all required fields.', true);
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Subscribing...';
            msgDiv.style.display = 'none';

            try {
                const res = await fetch(`${API_URL}/api/subscribe`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, interests })
                });

                const data = await res.json();

                if (res.ok) {
                    showMessage(data.message || 'Successfully subscribed! Check your email for confirmation.');
                    form.reset();
                } else {
                    showMessage(data.error || 'Something went wrong. Please try again.', true);
                }
            } catch (err) {
                console.error('Subscribe error:', err);
                showMessage('Failed to connect. Please try again later.', true);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Subscribe';
            }
        });
    })();
    </script>
</body>
</html>
