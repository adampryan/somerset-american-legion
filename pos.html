<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex">
    <title>Post 228 Bar POS</title>
    <meta name="build" content="20260822-4"><!-- bump on every pos.html change; drives auto-update below -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
      :root {
        --navy-deep:#081733; --navy-dark:#0d1f40; --navy:#14294f; --navy-light:#2b4372;
        --red:#b41229; --red-dark:#8a0f20; --gold:#c9a227; --gold-light:#e0be52; --gold-soft:#f3e6c0;
        --cream:#f6f3ec; --surface:#fff; --ink:#1a1f2b; --muted:#5f6878; --line:#eaecf0; --green:#1f7a37;
        --sh-sm:0 1px 2px rgba(13,31,64,.06),0 1px 1px rgba(13,31,64,.04);
        --sh-md:0 2px 4px rgba(13,31,64,.06),0 6px 16px rgba(13,31,64,.08);
        --sh-lg:0 4px 10px rgba(13,31,64,.08),0 16px 32px rgba(13,31,64,.12);
        --r-card:14px; --r-tile:12px; --r-btn:10px;
      }
      * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body { margin:0; height:100%; font-family:'Source Sans 3',sans-serif; background:var(--cream); color:var(--ink); overscroll-behavior:none; overflow:hidden; }
      button { font-family:inherit; cursor:pointer; }
      .hidden { display:none !important; }

      /* Lock screen */
      #lock { position:fixed; inset:0; background:linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:50; padding:20px; }
      #lock h1 { font-family:'Cinzel',serif; font-weight:700; margin:0 0 4px; letter-spacing:.02em; }
      #lock p { color:rgba(255,255,255,.75); margin:0; }
      #pin { font-size:2rem; letter-spacing:.4rem; text-align:center; width:240px; padding:14px; border-radius:var(--r-btn); border:none; margin:16px 0; box-shadow:var(--sh-md); color:var(--navy-deep); }
      .keypad { display:grid; grid-template-columns:repeat(3,88px); gap:12px; }
      .keypad button { height:78px; font-size:1.6rem; font-weight:600; border-radius:var(--r-tile); border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.12); color:#fff; transition:transform .08s ease,background .12s ease; }
      .keypad button:active { background:var(--gold); color:var(--navy-deep); transform:scale(.96); }

      /* Layout */
      #app { display:flex; flex-direction:column; height:100%; }
      header { background:linear-gradient(180deg,var(--navy) 0%,var(--navy-dark) 100%); color:#fff; display:flex; align-items:center; gap:12px; padding:10px 16px; flex-shrink:0; flex-wrap:wrap; box-shadow:var(--sh-md); border-bottom:3px solid var(--gold); }
      header .title { font-family:'Cinzel',serif; font-weight:700; font-size:1.15rem; letter-spacing:.01em; }
      header input { padding:8px 10px; border-radius:8px; border:none; box-shadow:var(--sh-sm); }
      header select { box-shadow:var(--sh-sm); }
      header .spacer { flex:1; }
      header button { background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.18); padding:10px 14px; border-radius:var(--r-btn); font-weight:600; min-height:44px; transition:background .12s ease; }
      header button:active { background:rgba(255,255,255,.28); }
      .main { display:flex; flex:1; min-height:0; }
      .menu { flex:1; overflow:auto; padding:14px; min-height:0; }
      .cats { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
      .cat { padding:10px 18px; min-height:44px; border-radius:var(--radius-full,999px); border:2px solid var(--navy); background:var(--surface); color:var(--navy); font-weight:600; box-shadow:var(--sh-sm); transition:transform .08s ease,background .12s ease,color .12s ease; }
      .cat:active { transform:scale(.97); }
      .cat.sel { background:var(--navy); color:#fff; border-color:var(--navy); }
      .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:12px; }
      .prod { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-tile); padding:16px 10px; text-align:center; box-shadow:var(--sh-sm); min-height:92px; display:flex; flex-direction:column; justify-content:center; gap:2px; transition:transform .08s ease,box-shadow .15s ease; }
      .prod:hover { box-shadow:var(--sh-md); }
      .prod:active { transform:scale(.96); box-shadow:var(--sh-sm); border-color:var(--gold); }
      .prod .n { font-weight:600; display:block; line-height:1.2; color:var(--ink); }
      .prod .p { color:var(--navy); font-weight:800; margin-top:4px; font-size:1.05rem; }
      .prod .stock { font-size:.7rem; color:var(--red); font-weight:600; }
      .prod .rcp { font-size:.62rem; color:var(--navy); font-weight:700; margin-top:4px; border:1px solid var(--navy); border-radius:6px; padding:1px 7px; opacity:.85; letter-spacing:.02em; }
      .prod .rcp:active { background:var(--navy); color:#fff; }

      /* Cart */
      .cart { width:340px; background:var(--surface); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; box-shadow:var(--sh-lg); }
      .cart .head { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; font-size:1.05rem; }
      .cart .head strong { color:var(--navy); }
      .cart .items { flex:1; overflow:auto; padding:8px 14px; min-height:0; }
      .ci { display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); }
      .ci .n { flex:1; font-weight:600; }
      .ci .q { display:flex; align-items:center; gap:10px; font-weight:700; min-width:44px; justify-content:center; }
      .ci .q button { width:44px; height:44px; border-radius:10px; border:1px solid var(--gray-300,#d8dce3); background:var(--cream); color:var(--navy); font-size:1.3rem; font-weight:700; line-height:1; transition:transform .08s ease,background .12s ease; }
      .ci .q button:active { transform:scale(.92); background:var(--gold-soft); }
      .totals { padding:14px 16px; border-top:1px solid var(--line); background:var(--cream); }
      .totals .row { display:flex; justify-content:space-between; padding:3px 0; }
      .totals .grand { font-size:1.55rem; font-weight:800; color:var(--navy); }
      .tips { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:10px 0; }
      .tips button { padding:12px 2px; min-height:48px; border:2px solid var(--navy); background:var(--surface); color:var(--navy); border-radius:var(--r-btn); font-weight:700; font-size:.85rem; transition:transform .08s ease; }
      .tips button:active { transform:scale(.95); }
      .tips button.sel { background:var(--navy); color:#fff; }
      .pay { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; padding:12px 16px 8px; }
      .pay button { padding:18px 4px; min-height:64px; border:none; border-radius:var(--r-btn); color:#fff; font-weight:800; font-size:1.05rem; box-shadow:var(--sh-md); transition:transform .08s ease,filter .12s ease; }
      .pay button:active { transform:scale(.96); filter:brightness(1.08); }
      .pay .cash{ background:linear-gradient(180deg,#249245 0%,var(--green) 100%); }
      .pay .card{ background:linear-gradient(180deg,var(--navy-light) 0%,var(--navy) 100%); }
      .pay .qr{ background:linear-gradient(180deg,var(--red-light,#d5233c) 0%,var(--red) 100%); }
      .sub { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:0 16px 16px; }
      .sub button { padding:14px; min-height:52px; border-radius:var(--r-btn); border:2px solid var(--navy); background:var(--surface); color:var(--navy); font-weight:600; transition:transform .08s ease,background .12s ease; }
      .sub button:active { transform:scale(.97); background:var(--cream); }

      /* Modal */
      .overlay { position:fixed; inset:0; background:rgba(8,23,51,.55); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:40; padding:16px; }
      .modal { background:var(--surface); border-radius:var(--r-card); padding:22px; max-width:420px; width:100%; max-height:90vh; overflow:auto; text-align:center; box-shadow:var(--sh-lg); }
      .modal h2 { color:var(--navy); margin-top:0; font-family:'Cinzel',serif; }
      .modal .big { font-size:3rem; }
      #qrbox { display:flex; justify-content:center; margin:14px 0; padding:14px; background:#fff; border-radius:var(--r-tile); box-shadow:var(--sh-sm); }
      .btn { padding:16px; min-height:56px; border-radius:var(--r-btn); border:none; font-weight:800; font-size:1.05rem; width:100%; margin-top:10px; transition:transform .08s ease,filter .12s ease; }
      .btn:active { transform:scale(.98); }
      .btn.primary { background:linear-gradient(180deg,var(--red-light,#d5233c) 0%,var(--red) 100%); color:#fff; box-shadow:var(--sh-md); }
      .btn.ghost { background:var(--cream); color:var(--navy); border:1px solid var(--line); }
      .err { color:#721c24; background:#f8d7da; padding:10px; border-radius:8px; margin-top:10px; display:none; }
      .tablist .tab { display:flex; justify-content:space-between; align-items:center; padding:14px; border:1px solid var(--line); border-radius:var(--r-tile); margin-bottom:8px; box-shadow:var(--sh-sm); }
      .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:14px 22px; border-radius:var(--r-btn); z-index:60; box-shadow:var(--sh-lg); font-weight:600; border-left:4px solid var(--gold); }

      /* Responsive — allow reflow / scroll on smaller tablets & phones (< 820px).
         Wide-tablet two-column layout is preserved above this breakpoint. */
      @media (max-width:820px) {
        html,body { overflow:auto; height:auto; min-height:100%; }
        #app { min-height:100vh; }
        .main { flex-direction:column; min-height:0; }
        .menu { overflow:visible; }
        .cart { width:100%; border-left:none; border-top:3px solid var(--gold); box-shadow:0 -6px 16px rgba(13,31,64,.10); }
        .cart .items { max-height:38vh; }
        .grid { grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); }
      }
      @media (max-width:420px) {
        .keypad { grid-template-columns:repeat(3,72px); }
        .pay button { font-size:.95rem; padding:16px 2px; }
        .grid { grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); }
      }

      @media (prefers-reduced-motion:reduce) {
        * { transition:none !important; animation:none !important; }
        .keypad button:active,.cat:active,.prod:active,.ci .q button:active,
        .pay button:active,.tips button:active,.sub button:active,.btn:active { transform:none; }
      }
    </style>
</head>
<body>

  <!-- LOCK -->
  <div id="lock">
    <h1>Post 228 Bar</h1>
    <p>Enter passcode</p>
    <input id="pin" type="password" inputmode="numeric" readonly>
    <div class="keypad" id="keypad"></div>
    <div id="lockerr" style="color:#ffb3b3;height:20px;margin-top:10px;"></div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <header>
      <span class="title">🍺 Post 228 Bar</span>
      <select id="server" style="max-width:170px;padding:7px 8px;border-radius:8px;border:none;"><option value="">— Bartender —</option></select>
      <span class="spacer"></span>
      <button onclick="openTabs()">Tabs (<span id="tabcount">0</span>)</button>
      <button id="lockBtn" onclick="lock()">Lock</button>
    </header>
    <div class="main">
      <div class="menu">
        <div class="cats" id="cats"></div>
        <div class="grid" id="grid"></div>
      </div>
      <div class="cart">
        <div class="head"><strong id="cartTitle">New Order</strong><span class="spacer" style="flex:1"></span><button onclick="clearItems()" style="border:none;background:none;color:#a00;">Clear</button></div>
        <div class="items" id="cartItems"><p style="color:#999;text-align:center;margin-top:30px;">Tap items to add</p></div>
        <div class="totals">
          <div class="row grand"><span>Total</span><span id="grand">$0.00</span></div>
          <div style="font-size:.75rem;color:#999;margin-top:4px;">Tip is added at payment (card &amp; QR: customer; cash: next screen)</div>
        </div>
        <div class="pay">
          <button class="cash" onclick="charge('cash')">💵 Cash</button>
          <button class="card" onclick="charge('manual')">💳 Card</button>
          <button class="qr" onclick="charge('qr')">📱 QR</button>
        </div>
        <div class="sub">
          <button onclick="saveTab()">💾 Save Tab</button>
          <button onclick="window._tabCard()">💳 Tab Card</button>
          <button onclick="splitPrompt()">➗ Split</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast hidden"></div>

  <script>
  (function(){
    const API='https://api.somersetamericanlegion.org';
    const PK='pk_live_51TwB328bZUvgIDVc33cBpRuFwCgJHmRo4z4vHZ64vxIJUcTa25KbfCvwfbdSRSiSMQmMNSEh5vqRD8Px7X2RtquF00L7FNM0lz';
    let TOKEN=localStorage.getItem('pos_token')||'';
    // When embedded inside the admin panel (same origin), reuse the manager's login
    // so no separate passcode is needed.
    let EMBEDDED=false, embeddedUser=null;
    if(!TOKEN){ const adm=localStorage.getItem('legion_token'); if(adm){ TOKEN=adm; EMBEDDED=true; try{ embeddedUser=JSON.parse(localStorage.getItem('legion_user')||'null'); }catch(e){} } }
    let products=[], cart=[], curCat='all', orderId=null, splitWays=1, lastActivity=Date.now();
    let openedFromTab=false;   // true when the current order is a reopened saved tab (so cancel/clear won't discard it)
    const stripe=window.Stripe?Stripe(PK):null;
    const $=id=>document.getElementById(id);
    const money=c=>'$'+(c/100).toFixed(2);
    const auth=()=>({'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'});
    function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200);}

    // ---------- lock / auth ----------
    function buildKeypad(){
      const k=$('keypad'); const keys=['1','2','3','4','5','6','7','8','9','⌫','0','OK'];
      k.innerHTML=keys.map(x=>`<button data-k="${x}">${x}</button>`).join('');
      k.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
        const v=b.dataset.k;
        if(v==='⌫') $('pin').value=$('pin').value.slice(0,-1);
        else if(v==='OK') unlock();
        else $('pin').value+=v;
      }));
    }
    async function unlock(){
      const passcode=$('pin').value;
      try{
        const r=await fetch(`${API}/api/pos/session`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode})});
        const j=await r.json();
        if(!r.ok) throw new Error(j.error||'Wrong passcode');
        TOKEN=j.token; localStorage.setItem('pos_token',TOKEN);
        // Personal PIN → the session knows who's ringing; shared house code → roster picker.
        if(j.bartender) localStorage.setItem('pos_bartender',JSON.stringify(j.bartender));
        else localStorage.removeItem('pos_bartender');
        startApp();
      }catch(e){ $('lockerr').textContent=e.message; $('pin').value=''; }
    }
    function pinBartender(){ try{ return JSON.parse(localStorage.getItem('pos_bartender')||'null'); }catch(e){ return null; } }
    function lock(){ localStorage.removeItem('pos_token'); localStorage.removeItem('pos_bartender'); TOKEN=''; location.reload(); }

    async function startApp(){
      $('lock').classList.add('hidden'); $('app').classList.remove('hidden');
      if(EMBEDDED && embeddedUser){
        // Behind the admin login: the logged-in user IS the bartender — show their name, no picker.
        $('lockBtn').style.display='none';
        $('server').outerHTML = `<span id="serverLabel" style="color:#fff;font-weight:600;padding:6px 8px;white-space:nowrap;"><i class="fa"></i>👤 ${embeddedUser.name}</span>`;
      } else if(pinBartender()){
        // Personal-PIN session: the login IS the bartender — show the name, no picker.
        $('server').outerHTML = `<span id="serverLabel" style="color:#fff;font-weight:600;padding:6px 8px;white-space:nowrap;">👤 ${pinBartender().name}</span>`;
      } else {
        if(EMBEDDED) $('lockBtn').style.display='none';
        await loadBartenders();
      }
      await loadMenu(); refreshTabs();
    }
    async function loadBartenders(){
      try{
        const r=await fetch(`${API}/api/pos/bartenders`,{headers:auth()});
        const list=await r.json();
        const sel=$('server');
        sel.innerHTML='<option value="">— Bartender —</option>'+(Array.isArray(list)?list:[]).map(b=>`<option value="${b.id}">${b.name}</option>`).join('');
        const saved=localStorage.getItem('pos_bartender_id'); if(saved) sel.value=saved;
        sel.addEventListener('change',()=>localStorage.setItem('pos_bartender_id',sel.value));
      }catch(e){}
    }
    // Who the sale is attributed to. Embedded → the logged-in user; standalone → the roster picker.
    function serverInfo(){
      if(EMBEDDED && embeddedUser) return { server_id:null, server_name: embeddedUser.name };
      const pb=pinBartender(); if(pb) return { server_id:null, server_name: pb.name }; // pb.id is a users id, not a roster id
      const sel=$('server'); if(!sel) return { server_id:null, server_name:null };
      const opt=sel.options[sel.selectedIndex]; return { server_id: sel.value?parseInt(sel.value,10):null, server_name:(sel.value&&opt)?opt.text:null };
    }
    // A bartender must be identified before an order is created/charged.
    function requireServer(){
      if(EMBEDDED && embeddedUser) return true;   // logged-in user is the bartender
      if(pinBartender()) return true;             // personal-PIN login is the bartender
      if(serverInfo().server_id) return true;
      toast('Select a bartender first');
      const s=$('server'); if(s){ s.focus(); s.style.outline='3px solid #b22234'; setTimeout(()=>s.style.outline='',1600); }
      return false;
    }

    // ---------- menu ----------
    async function loadMenu(){
      const r=await fetch(`${API}/api/pos/products`,{headers:auth()});
      if(r.status===401){ lock(); return; }
      products=await r.json();
      const cats=['all',...[...new Set(products.map(p=>p.category))]];
      $('cats').innerHTML=cats.map(c=>`<button class="cat${c===curCat?' sel':''}" data-c="${c}">${CAT_LABELS[c]||(c[0].toUpperCase()+c.slice(1))}</button>`).join('');
      $('cats').querySelectorAll('.cat').forEach(b=>b.addEventListener('click',()=>{curCat=b.dataset.c;renderMenu();$('cats').querySelectorAll('.cat').forEach(x=>x.classList.toggle('sel',x.dataset.c===curCat));}));
      renderMenu();
    }
    const CAT_LABELS={all:'All',mixed:'Mixed Drinks',na:'N/A'};
    function renderMenu(){
      const list=products.filter(p=>curCat==='all'||p.category===curCat);
      $('grid').innerHTML=list.map(p=>`<button class="prod" data-id="${p.id}"><span class="n">${p.name}</span><span class="p">${money(p.price)}</span>${p.track_inventory?`<span class="stock">${p.stock_qty} left</span>`:''}${p.recipe?`<span class="rcp" data-rid="${p.id}">ⓘ recipe</span>`:''}</button>`).join('');
      $('grid').querySelectorAll('.prod').forEach(b=>b.addEventListener('click',()=>addToCart(+b.dataset.id)));
      // tapping the recipe chip shows the recipe without adding the drink to the cart
      $('grid').querySelectorAll('.rcp').forEach(s=>s.addEventListener('click',e=>{e.stopPropagation();showRecipe(+s.dataset.rid);}));
    }
    function showRecipe(id){
      const p=products.find(x=>x.id===id); if(!p)return;
      const esc=(t)=>(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
      modal(`<div class="modal" style="text-align:left;"><h2 style="text-align:center;color:var(--navy);">${esc(p.name)} — ${money(p.price)}</h2><p style="white-space:pre-wrap;line-height:1.55;font-size:1.02rem;">${esc(p.recipe)}</p><button class="btn primary" onclick="window._close()">Close</button></div>`);
    }

    // ---------- cart ----------
    function addToCart(id){
      lastActivity=Date.now();
      const p=products.find(x=>x.id===id); if(!p)return;
      const ex=cart.find(x=>x.product_id===id);
      if(ex)ex.qty++; else cart.push({product_id:id,name:p.name,price:p.price,qty:1});
      renderCart();
    }
    function chg(id,d){ const it=cart.find(x=>x.product_id===id); if(!it)return; it.qty+=d; if(it.qty<=0)cart=cart.filter(x=>x!==it); renderCart(); }
    function resetOrder(){ cart=[]; orderId=null; splitWays=1; openedFromTab=false; $('cartTitle').textContent='New Order'; renderCart(); } // start fresh
    // Void a checkout order that was created just for an unpaid charge (NOT a reopened
    // saved tab) — so a cancelled/cleared order never lingers in the tab list.
    async function discardFreshOrder(){
      if(orderId && !openedFromTab){
        try{ await fetch(`${API}/api/pos/orders/${orderId}/void`,{method:'POST',headers:auth()}); }catch(e){}
        orderId=null;
      }
    }
    async function clearItems(){ await discardFreshOrder(); cart=[]; renderCart(); await refreshTabs(); } // discard the current order and its phantom tab
    // Cancel out of a payment screen: drop any phantom order and return to the order screen (cart kept).
    window._cancelPay=async()=>{ await discardFreshOrder(); closeModal(); renderCart(); await refreshTabs(); };
    function subtotal(){ return cart.reduce((s,i)=>s+i.price*i.qty,0); }
    function renderCart(){
      if(!cart.length){ $('cartItems').innerHTML='<p style="color:#999;text-align:center;margin-top:30px;">Tap items to add</p>'; }
      else $('cartItems').innerHTML=cart.map(i=>`<div class="ci"><span class="n">${i.name}</span><span class="q"><button onclick="window._chg(${i.product_id},-1)">−</button>${i.qty}<button onclick="window._chg(${i.product_id},1)">+</button></span><span>${money(i.price*i.qty)}</span></div>`).join('');
      $('grand').textContent=money(subtotal());
    }
    window._chg=chg;

    // ---------- ensure an order exists on the server ----------
    async function ensureOrder(){
      if(orderId) return orderId;
      if(!cart.length){ toast('Cart is empty'); throw new Error('empty'); }
      const r=await fetch(`${API}/api/pos/orders`,{method:'POST',headers:auth(),body:JSON.stringify({items:cart.map(i=>({product_id:i.product_id,qty:i.qty})),...serverInfo()})});
      const j=await r.json(); if(!r.ok)throw new Error(j.error||'order failed');
      orderId=j.id; return orderId;
    }

    // ---------- charge ----------
    async function charge(method){
      try{
        lastActivity=Date.now();
        if(!cart.length){ toast('Cart is empty'); return; }
        if(!orderId && !requireServer()) return;   // new order needs a bartender
        const id=await ensureOrder();
        if(method==='cash') return cashModal(id);           // cash tip on its own screen
        const sub=subtotal();
        const amount = splitWays>1 ? Math.ceil(sub/splitWays) : undefined; // even split share
        const body={ method, tip:0, ...(amount?{amount}:{}) }; // card & QR: customer picks the tip
        const r=await fetch(`${API}/api/pos/orders/${id}/charge`,{method:'POST',headers:auth(),body:JSON.stringify(body)});
        const j=await r.json(); if(!r.ok)throw new Error(j.error||'charge failed');
        if(method==='qr') return qrModal(j);
        if(method==='manual') return manualModal(j);
      }catch(e){ if(e.message!=='empty') toast(e.message); }
    }

    // Cash: simple confirm and record (no tip — cash tips go in the jar).
    function cashModal(id){
      const base = splitWays>1 ? Math.ceil(subtotal()/splitWays) : subtotal();
      modal(`<div class="modal">
        <h2>Cash Payment</h2>
        <div style="font-size:2.2rem;color:var(--navy);font-weight:700;margin:14px 0;">${money(base)}</div>
        <button class="btn primary" id="cpay" style="background:#2e7d32;">Record ${money(base)} Cash</button>
        <button class="btn ghost" onclick="window._cancelPay()">Cancel</button>
        <div class="err" id="cerr"></div>
      </div>`);
      $('cpay').addEventListener('click',async()=>{
        $('cpay').disabled=true;
        try{
          const amount = splitWays>1 ? base : undefined;
          const r=await fetch(`${API}/api/pos/orders/${id}/charge`,{method:'POST',headers:auth(),body:JSON.stringify({method:'cash',tip:0,...(amount?{amount}:{})})});
          const j=await r.json(); if(!r.ok)throw new Error(j.error||'charge failed');
          saleDone(`Cash recorded — ${money(base)}`);
        }catch(e){ $('cerr').textContent=e.message; $('cerr').style.display='block'; $('cpay').disabled=false; }
      });
    }

    function closeModal(){ $('modalRoot').innerHTML=''; }
    function modal(html){ $('modalRoot').innerHTML=`<div class="overlay">${html}</div>`; }

    function doneModal(msg){
      const done=orderPaidCheck();
      modal(`<div class="modal"><div class="big">✅</div><h2>${msg}</h2><button class="btn primary" onclick="window._next()">New Order</button></div>`);
      poll(orderId);
    }
    function orderPaidCheck(){}
    window._next=()=>{ closeModal(); resetOrder(); loadMenu(); refreshTabs(); };
    // After a completed sale: brief ✅, then auto-return to a fresh register (stay in the POS).
    function saleDone(msg){
      lastActivity=Date.now();
      modal(`<div class="modal" style="text-align:center;"><div class="big">✅</div><h2>${msg}</h2><p style="color:#888;">Ready for next order…</p></div>`);
      setTimeout(()=>{ closeModal(); resetOrder(); loadMenu(); refreshTabs(); }, 1500);
    }

    // QR
    function qrModal(j){
      modal(`<div class="modal"><h2>Scan to Pay</h2><p>Customer scans, adds a tip, and pays on their phone.</p><div id="qrbox"></div><p style="word-break:break-all;font-size:.75rem;color:#888;">${j.pay_url}</p><div id="qrstatus">Waiting for payment…</div><button class="btn ghost" onclick="window._cancelPay()">Cancel</button></div>`);
      new QRCode($('qrbox'),{text:j.pay_url,width:230,height:230,colorDark:'#002868'});
      poll(orderId, ()=>{ saleDone('Paid — thank you!'); });
    }

    // Manual card entry (turn the tablet to the customer): tip + total, then card.
    function manualModal(j){
      const base=j.amount; let tipC=0;
      modal(`<div class="modal" style="text-align:left;">
        <h2 style="text-align:center;">Card Payment</h2>
        <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>Subtotal</span><strong>${money(base)}</strong></div>
        <p style="margin:10px 0 4px;font-weight:600;">Add a tip?</p>
        <div class="tips" id="mTips"></div>
        <input type="number" id="mCustom" placeholder="Custom tip ($)" min="0" step="0.50" style="display:none;width:100%;padding:9px;margin-top:8px;border:1px solid #ccc;border-radius:8px;">
        <div style="display:flex;justify-content:space-between;padding:4px 0;margin-top:6px;"><span>Tip</span><strong id="mTip">$0.00</strong></div>
        <div style="display:flex;justify-content:space-between;border-top:2px solid var(--navy);padding-top:8px;margin-top:4px;font-size:1.35rem;color:var(--navy);"><strong>Total</strong><strong id="mTotal">${money(base)}</strong></div>
        <div id="pe" style="margin-top:14px;"></div>
        <button class="btn primary" id="mpay">Pay ${money(base)}</button>
        <button class="btn ghost" onclick="window._cancelPay()">Cancel</button>
        <div class="err" id="merr"></div>
      </div>`);
      const opts=[['15%',.15],['18%',.18],['20%',.20],['$',null]];
      $('mTips').innerHTML=opts.map((o,i)=>`<button type="button" data-pct="${o[1]}" class="${o[1]===.15?'sel':''}">${o[0]}</button>`).join('');
      const elements=stripe.elements({clientSecret:j.clientSecret, fonts:[{cssSrc:'https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap'}], appearance:{theme:'stripe',variables:{colorPrimary:'#002868',fontFamily:'"Source Sans 3",sans-serif',borderRadius:'8px'}}});
      elements.create('payment').mount('#pe');

      async function setTip(c){
        tipC=c; $('mTip').textContent=money(c); $('mTotal').textContent=money(base+c); $('mpay').textContent='Pay '+money(base+c);
        try{ const r=await fetch(`${API}/api/pos/payments/${j.payment_id}/tip`,{method:'POST',headers:auth(),body:JSON.stringify({tip:c})}); if(r.ok) await elements.fetchUpdates(); }catch(e){}
      }
      $('mTips').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
        $('mTips').querySelectorAll('button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
        if(b.dataset.pct==='null'){ $('mCustom').style.display='block'; $('mCustom').focus(); }
        else { $('mCustom').style.display='none'; setTip(Math.round(base*parseFloat(b.dataset.pct))); }
      }));
      $('mCustom').addEventListener('input',()=>setTip(Math.max(0,Math.round((parseFloat($('mCustom').value)||0)*100))));
      setTip(Math.round(base*.15));   // default the card tip to 15%

      $('mpay').addEventListener('click',async()=>{
        $('mpay').disabled=true; const t=$('mpay').textContent; $('mpay').textContent='Processing…';
        const {error,paymentIntent}=await stripe.confirmPayment({elements,confirmParams:{return_url:location.href},redirect:'if_required'});
        if(error){ $('merr').textContent=error.message; $('merr').style.display='block'; $('mpay').disabled=false; $('mpay').textContent=t; return; }
        if(paymentIntent&&paymentIntent.status==='succeeded'){ saleDone(`Approved — ${money(base+tipC)}`); }
      });
    }

    // poll order until paid
    async function poll(id, onPaid){
      for(let i=0;i<90;i++){
        await new Promise(r=>setTimeout(r,2000));
        try{ const r=await fetch(`${API}/api/pos/orders/${id}`,{headers:auth()}); const o=await r.json();
          if(o.status==='paid'){ if(onPaid)onPaid(); refreshTabs(); return; } }catch(e){}
        if(!$('modalRoot').innerHTML) return;
      }
    }

    // ---------- tabs ----------
    async function saveTab(){
      const items=cart.map(i=>({product_id:i.product_id,qty:i.qty}));
      if(orderId){
        // Reopened tab. Emptied out -> close it; otherwise update it in place.
        if(items.length===0){
          if(!confirm('This tab is empty — close it?')) return;
          await fetch(`${API}/api/pos/orders/${orderId}/void`,{method:'POST',headers:auth()});
          toast('Tab closed'); resetOrder(); refreshTabs(); return;
        }
        const r=await fetch(`${API}/api/pos/orders/${orderId}/items`,{method:'PUT',headers:auth(),body:JSON.stringify({items})});
        if(r.ok){ toast('Tab updated'); resetOrder(); refreshTabs(); }
      } else {
        if(!items.length){ toast('Cart is empty'); return; }
        if(!requireServer()) return;
        window._nameModal('Name this tab','',async(label)=>{
          const r=await fetch(`${API}/api/pos/orders`,{method:'POST',headers:auth(),body:JSON.stringify({items,label:label||null,...serverInfo()})});
          if(r.ok){ toast('Tab saved'+(label?`: ${label}`:'')); resetOrder(); refreshTabs(); }
        });
      }
    }
    async function refreshTabs(){
      try{ const r=await fetch(`${API}/api/pos/orders?status=open`,{headers:auth()}); const t=await r.json(); window._tabs=t; $('tabcount').textContent=t.length; }catch(e){}
    }
    async function openTabs(){
      const t=window._tabs||[];
      const btn='class="btn ghost" style="width:auto;padding:6px 9px;margin:0 0 0 4px;"';
      modal(`<div class="modal"><h2>Open Tabs</h2><div class="tablist">${t.length?t.map(o=>`<div class="tab"><span>${_esc(o.label||'Tab #'+o.id)}${o.card_last4?` <span style="color:#1f7a37;font-size:.78rem;white-space:nowrap;">💳••${_esc(o.card_last4)}</span>`:''}</span><span style="white-space:nowrap;">${money(o.subtotal)} <button class="btn primary" style="width:auto;padding:6px 11px;margin:0 0 0 6px;" onclick="window._openTab(${o.id})">Open</button> <button ${btn} title="Rename" onclick="window._renameTab(${o.id})">✎</button> <button ${btn} title="Card on file" onclick="window._tabCardModal(${o.id})">💳</button> <button ${btn} title="Close/discard tab" onclick="window._closeTab(${o.id})">✕</button></span></div>`).join(''):'<p>No open tabs.</p>'}</div><button class="btn ghost" onclick="window._close()">Done</button></div>`);
    }
    window._openTab=async(id)=>{
      const r=await fetch(`${API}/api/pos/orders/${id}`,{headers:auth()}); const o=await r.json();
      orderId=id; openedFromTab=true; cart=o.items.map(i=>({product_id:i.product_id,name:i.name,price:i.unit_price,qty:i.qty}));
      $('cartTitle').textContent=(o.label||'Tab #'+id);
      closeModal(); renderCart();
    };
    window._closeTab=async(id)=>{
      if(!confirm('Close and discard this tab? No payment will be recorded.')) return;
      await fetch(`${API}/api/pos/orders/${id}/void`,{method:'POST',headers:auth()});
      if(orderId===id) resetOrder();
      await refreshTabs(); openTabs();
    };
    window._close=closeModal;

    // ---------- tab naming ----------
    const _esc=s=>String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
    const STRIPE_APPEARANCE={theme:'stripe',variables:{colorPrimary:'#002868',fontFamily:'"Source Sans 3",sans-serif',borderRadius:'8px'}};
    const STRIPE_FONTS=[{cssSrc:'https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap'}];
    window._nameModal=(title,current,cb)=>{
      modal(`<div class="modal"><h2>${_esc(title)}</h2>
        <input id="nameInp" type="text" value="${_esc(current)}" placeholder="Customer name"
          style="width:100%;padding:14px;font-size:1.15rem;border:1px solid #ccc;border-radius:10px;margin:14px 0;">
        <button class="btn primary" id="nameSave">Save</button>
        <button class="btn ghost" onclick="window._close()">Cancel</button></div>`);
      setTimeout(()=>{ const i=$('nameInp'); if(i){ i.focus(); } },60);
      $('nameSave').addEventListener('click',()=>{ const v=$('nameInp').value.trim(); closeModal(); cb(v); });
    };
    window._renameTab=(id)=>{
      const t=(window._tabs||[]).find(x=>x.id===id);
      window._nameModal('Name this tab',(t&&t.label)||'',async(label)=>{
        await fetch(`${API}/api/pos/orders/${id}/label`,{method:'POST',headers:auth(),body:JSON.stringify({label})});
        if(orderId===id) $('cartTitle').textContent=label||('Tab #'+id);
        await refreshTabs(); openTabs();
      });
    };

    // ---------- card on file ----------
    window._tabCard=async()=>{
      if(!orderId){ toast('Save the tab first, then add a card'); return; }
      window._tabCardModal(orderId);
    };
    window._tabCardModal=async(id)=>{
      let o; try{ o=await (await fetch(`${API}/api/pos/orders/${id}`,{headers:auth()})).json(); }catch(e){ toast('Could not load tab'); return; }
      const due=(o.subtotal||0)-(o.amount_paid||0);
      if(o.card_last4){
        modal(`<div class="modal"><h2>Tab Card</h2>
          <p style="font-size:1.25rem;margin:10px 0;">💳 ${_esc(o.card_brand||'Card')} ••${_esc(o.card_last4)} on file</p>
          ${due>0?`<button class="btn primary" onclick="window._chargeCard(${id})">Charge ${money(due)} + tip to card</button>`:'<p style="color:#888;">Nothing left to charge.</p>'}
          <button class="btn ghost" onclick="window._addCard(${id})">Replace card</button>
          <button class="btn ghost" onclick="window._close()">Close</button></div>`);
      } else {
        modal(`<div class="modal"><h2>Tab Card</h2>
          <p style="color:#666;">No card on file. Add the customer's card — it's saved now (no charge) and charged when the tab closes.</p>
          <button class="btn primary" onclick="window._addCard(${id})">Add card</button>
          <button class="btn ghost" onclick="window._close()">Close</button></div>`);
      }
    };
    window._addCard=async(id)=>{
      let j; try{ const r=await fetch(`${API}/api/pos/orders/${id}/setup-card`,{method:'POST',headers:auth()}); j=await r.json(); if(!r.ok)throw new Error(j.error||'setup failed'); }
      catch(e){ toast(e.message); return; }
      modal(`<div class="modal" style="text-align:left;">
        <h2 style="text-align:center;">Add Card to Tab</h2>
        <p style="color:#888;text-align:center;margin-top:0;">Saved now — charged when the tab closes.</p>
        <div id="setupPe" style="margin-top:8px;"></div>
        <button class="btn primary" id="saveCardBtn">Save Card</button>
        <button class="btn ghost" onclick="window._close()">Cancel</button>
        <div class="err" id="setupErr"></div></div>`);
      const elements=stripe.elements({clientSecret:j.clientSecret,fonts:STRIPE_FONTS,appearance:STRIPE_APPEARANCE});
      elements.create('payment').mount('#setupPe');
      $('saveCardBtn').addEventListener('click',async()=>{
        $('saveCardBtn').disabled=true; const t=$('saveCardBtn').textContent; $('saveCardBtn').textContent='Saving…';
        const {error,setupIntent}=await stripe.confirmSetup({elements,confirmParams:{return_url:location.href},redirect:'if_required'});
        if(error){ $('setupErr').textContent=error.message; $('setupErr').style.display='block'; $('saveCardBtn').disabled=false; $('saveCardBtn').textContent=t; return; }
        if(setupIntent&&setupIntent.status==='succeeded'){
          try{ const s=await (await fetch(`${API}/api/pos/orders/${id}/card-saved`,{method:'POST',headers:auth(),body:JSON.stringify({setup_intent_id:setupIntent.id})})).json();
            closeModal(); toast(`Card on file: ${s.card_brand||'card'} ••${s.card_last4||''}`); refreshTabs();
          }catch(e){ $('setupErr').textContent='Saved at Stripe but could not attach — try again.'; $('setupErr').style.display='block'; $('saveCardBtn').disabled=false; $('saveCardBtn').textContent=t; }
        }
      });
    };
    window._chargeCard=async(id)=>{
      let o; try{ o=await (await fetch(`${API}/api/pos/orders/${id}`,{headers:auth()})).json(); }catch(e){ toast('load failed'); return; }
      const base=(o.subtotal||0)-(o.amount_paid||0);
      if(base<=0){ toast('Nothing left to charge'); return; }
      let tipC=Math.round(base*.15);
      modal(`<div class="modal" style="text-align:left;">
        <h2 style="text-align:center;">Charge Card on File</h2>
        <p style="text-align:center;color:#888;margin-top:0;">💳 ${_esc(o.card_brand||'Card')} ••${_esc(o.card_last4||'')}</p>
        <div style="display:flex;justify-content:space-between;"><span>Subtotal</span><strong>${money(base)}</strong></div>
        <p style="margin:10px 0 4px;font-weight:600;">Tip</p>
        <div class="tips" id="ocTips"></div>
        <input type="number" id="ocCustom" placeholder="Custom tip ($)" min="0" step="0.50" style="display:none;width:100%;padding:9px;margin-top:8px;border:1px solid #ccc;border-radius:8px;">
        <div style="display:flex;justify-content:space-between;margin-top:6px;"><span>Tip</span><strong id="ocTip">${money(tipC)}</strong></div>
        <div style="display:flex;justify-content:space-between;border-top:2px solid var(--navy);padding-top:8px;margin-top:4px;font-size:1.3rem;color:var(--navy);"><strong>Total</strong><strong id="ocTotal">${money(base+tipC)}</strong></div>
        <button class="btn primary" id="ocPay">Charge ${money(base+tipC)}</button>
        <button class="btn ghost" onclick="window._close()">Cancel</button>
        <div class="err" id="ocErr"></div></div>`);
      const popts=[['15%',.15],['18%',.18],['20%',.20],['$',null]];
      $('ocTips').innerHTML=popts.map(o2=>`<button type="button" data-pct="${o2[1]}" class="${o2[1]===.15?'sel':''}">${o2[0]}</button>`).join('');
      function setOc(c){ tipC=c; $('ocTip').textContent=money(c); $('ocTotal').textContent=money(base+c); $('ocPay').textContent='Charge '+money(base+c); }
      $('ocTips').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ $('ocTips').querySelectorAll('button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); if(b.dataset.pct==='null'){ $('ocCustom').style.display='block'; $('ocCustom').focus(); } else { $('ocCustom').style.display='none'; setOc(Math.round(base*parseFloat(b.dataset.pct))); } }));
      $('ocCustom').addEventListener('input',()=>setOc(Math.max(0,Math.round((parseFloat($('ocCustom').value)||0)*100))));
      $('ocPay').addEventListener('click',async()=>{
        $('ocPay').disabled=true; const t=$('ocPay').textContent; $('ocPay').textContent='Charging…';
        try{ const j=await (await fetch(`${API}/api/pos/orders/${id}/charge`,{method:'POST',headers:auth(),body:JSON.stringify({method:'oncard',tip:tipC})})).json();
          if(j.error)throw new Error(j.error);
          if(j.paid){ if(orderId===id){ saleDone(`Tab closed — ${money(base+tipC)} on card`); } else { closeModal(); toast(`Tab closed — ${money(base+tipC)} on card`); refreshTabs(); } }
          else { closeModal(); toast('Payment recorded'); refreshTabs(); }
        }catch(e){ $('ocErr').textContent=e.message; $('ocErr').style.display='block'; $('ocPay').disabled=false; $('ocPay').textContent=t; }
      });
    };

    // ---------- split ----------
    function splitPrompt(){
      const n=parseInt(prompt('Split evenly into how many payments?','2')||'1',10);
      splitWays=(n>=1&&n<=10)?n:1;
      toast(splitWays>1?`Split ${splitWays} ways — each Charge takes one ${money(Math.ceil(subtotal()/splitWays))} share`:'Split off');
    }

    window.charge=charge; window.openTabs=openTabs; window.saveTab=saveTab; window.splitPrompt=splitPrompt; window.clearItems=clearItems; window.lock=lock;

    // ---------- auto-update (defeats GitHub Pages' 10-min HTML cache on kiosks) ----------
    // Reload to a newer build ONLY when truly idle — empty cart, no modal, and no activity
    // (incl. a completed sale) in the last 3 min — so it never reloads right after a sale.
    const POS_BUILD = (document.querySelector('meta[name="build"]')||{}).content || '';
    async function checkUpdate(){
      try{
        if(cart.length || $('modalRoot').innerHTML || (Date.now()-lastActivity < 180000)) return;
        const html = await (await fetch(location.pathname + '?_cb=' + Date.now(), {cache:'no-store'})).text();
        const m = html.match(/name="build" content="([^"]+)"/);
        if(m && m[1] && m[1] !== POS_BUILD){
          location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
        }
      }catch(e){}
    }
    setInterval(checkUpdate, 5*60*1000);

    // ---------- boot ----------
    buildKeypad();
    if(TOKEN){ // verify token still works
      fetch(`${API}/api/pos/products`,{headers:auth()}).then(r=>{ if(r.ok) startApp(); else lock(); }).catch(()=>{});
    }
    checkUpdate();
  })();
  </script>
</body>
</html>
